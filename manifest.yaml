# ─────────────────────────────────────────────────────────────────────────────
# Your app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about your app is generated from this file, and
# the runtime refuses anything you did not declare here. If `outcomes` does not
# list it, your app cannot be asked to do it. If `output` does not name a
# field, returning that field is an error, not a bonus.
#
# That strictness is the point. A user installing your app sees a permission
# screen built from this file, so the file has to be the truth.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Your app keeps nothing between calls. This is not a preference you can
# change — every hackathon app runs with `persistence: none`, and the runtime
# throws away the machine your code ran on when it finishes.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# EMPTY ON PURPOSE. Claude asks you for it before anything else, and nothing
# publishes until it is filled in (the build says "Nothing to publish yet").
#
# It is the name everybody sees next to your app: "by <name>" on the install
# screen, in the list of apps and on every answer your app gives. So it is
# PUBLIC, and it should be a pseudonym: a made-up name or a nickname, never
# your real name and never an email address. This repository is public too,
# so anyone can read it here as well.
#
# The rules: 3 to 30 characters; letters, numbers, spaces, dots, hyphens and
# underscores; starting with a letter or a number; nothing that looks like an
# email or a web address; and not "pippa", "official" or "verified". Another
# builder cannot use the same name, and you can use yours on all your apps.
#
# It does not decide who owns the app, and nothing in this file does. Pippa
# Labs created this repository for your Pippa account, so every app published
# from it is yours. docs/REVIEW_AND_SHARING.md is the whole story.
app_author_name: "poppynoteaming"

app:
  # It must be `hack.` + this repository's name with `pippa-hack-` removed and
  # every hyphen turned into an underscore:
  #
  #     Pippa-Labs/pippa-hack-app-8f6e  ->  hack.app_8f6e
  #
  # Hyphens are not valid in an app id anywhere. `git remote get-url origin`
  # tells you the repository name.
  id: hack.app_8f6e
  name: Rent Check
  # Three numbers: 0.1.0, not 0.1 and not v0.1.0. Frozen once you press
  # Submit for review: bump it (0.1.0 -> 0.1.1) before the next push.
  version: 0.1.0
  # One or two sentences, written for someone deciding whether to install it.
  # Say what it does and what it sends anywhere. Never use the word "by" — the
  # badge Pippa shows is parsed from "[via <name> <version> by <author name>]"
  # (the author name is `app_author_name` above) and splits on the first "by".
  summary: >-
    Checks whether a London rent is cheap, fair, high or very high against
    official ONS rents for that borough and property type. It works from an
    ONS table shipped with the app and sends nothing anywhere.
agent_types:
  - personal

# ── Outcomes: the things your app can be asked to do ─────────────────────────
#
# An outcome is one job. Pippa picks between your outcomes — and between your
# app and every other app — by comparing the user's message against `summary`
# and `example_phrases`. So those two fields are not documentation; they are
# the behaviour that decides whether your app is used at all.
#
# Rent Check has one job, so one outcome. Only the first four phrases reach
# the skill chooser, so the best ones come first. None uses a word another
# app owns (today, tomorrow, calendar, remind, remember, search, news ...).

outcomes:
  - id: rent.check
    summary: Compare a London rent with the typical ONS rent for that borough and property type
    example_phrases:
      - is my rent fair
      - am i paying too much rent
      - is this rent fair for a room in
      - how does my rent compare in london
      - typical rent for a flat in
      - average rent for a two bed in
      - is this monthly rent too high for
      - check the rent for a studio in
    inputs:
      - name: rent
        type: string
        required: false
        description: >-
          The rent the person mentioned, exactly as they wrote it, including
          any pound sign, "k", "pcm", "a month", "a week" or "pw", for example
          "£1,100 a month", "1.1k", "£1100pcm" or "£250 a week". If the
          message names no amount, return an empty string. Never guess one.
      - name: area
        type: string
        required: false
        description: >-
          The London borough, neighbourhood or place the person named, exactly
          as they wrote it, misspellings and short names included, for example
          "Hammersmith", "Ken", "Peckham" or "Kensingtn". If the message names
          no place, return an empty string.
      - name: property_type
        type: string
        required: false
        description: >-
          What is being rented, as the person wrote it, for example "room",
          "studio", "1 bed", "two-bedroom flat" or "4 bed house". If the
          message does not say, return an empty string rather than guessing.
    output:
      - name: verdict
        type: string
        description: >-
          One of "cheap", "fair", "high" or "very high" when the rent could be
          compared with the ONS figure; an empty string when it could not (no
          rent given, or a place outside the ONS London boroughs).
      - name: borough
        type: string
        description: >-
          The ONS borough the figure is for, for example "Hammersmith and
          Fulham", or "London" for London as a whole; empty if the place was
          not recognised.
      - name: property_type
        type: string
        description: >-
          The property type compared: "room", "studio", "1-bed", "2-bed",
          "3-bed", "4+ bed" or "all properties"; empty if nothing was compared.
      - name: rent_per_month
        type: integer
        required: false
        description: The person's rent in whole pounds a month (weekly x 52 / 12).
      - name: typical_rent_per_month
        type: integer
        required: false
        description: The ONS typical rent for that borough and property type, in whole pounds a month.
      - name: difference_per_month
        type: integer
        required: false
        description: The person's rent minus the typical rent, in pounds a month; negative when below.
      - name: difference_percent
        type: integer
        required: false
        description: How far the person's rent is above (positive) or below (negative) the typical rent, in percent.
      - name: ons_period
        type: string
        description: The month the ONS figures describe, for example "October 2026"; empty if none was shown.
      - name: estimated
        type: boolean
        description: >-
          True when ONS publishes no figure for that borough and property type,
          so the typical rent is the average of the neighbouring boroughs.
      - name: caveat
        type: string
        description: >-
          The reminder that ONS covers all current tenancies, so newly
          advertised places usually cost a bit more; empty if no figure shown.
      - name: assumptions
        type: array
        item_type: string
        description: Each assumption the app made, for example that a missing property type means a room.
      - name: nearby_boroughs
        type: array
        item_type: string
        description: London boroughs to try instead when the place was not recognised or is outside London.
      - name: inputs_received
        type: array
        item_type: string
        description: >-
          Exactly the details the app was given, one per line, such as
          "rent: £1,100 a month". The app is given nothing else about the
          person.

# ── API keys ─────────────────────────────────────────────────────────────────
#
# Rent Check needs none: it calls no API at all. Its ONS figures ship beside
# app.py as ons_london_rents.json, and places as london_places.json.
#
# `connectors:` and `secrets:` are not used (hackathon apps may not use them).
